name: CI

on:
  push:
    branches:
      - master
      - develop
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run unit tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run build
        run: npm run build

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Dependency audit (high/critical)
        run: npm audit --omit=dev --audit-level=high

  # Full-stack Playwright: seeded API + rate-limited login.
  # Release gate on PRs into master. Manual re-run via workflow_dispatch.
  # Skipped on push, on PRs into other branches, and for Dependabot PRs.
  # Demo seed passwords come from .secrets.example; optional GH secrets override.
  e2e:
    name: Playwright
    if: >
      github.actor != 'dependabot[bot]'
      && (
        github.event_name == 'workflow_dispatch'
        || (github.event_name == 'pull_request' && github.base_ref == 'master')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      VITE_API_BASE_URL: http://localhost:3000
      # Optional overrides. Empty (unset secret) is stripped in playwright.config.ts
      # so .secrets.example fills demo seed credentials.
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
      E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
      E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}

    steps:
      - name: Checkout dashboard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ecommerce-admin-dashboard
          persist-credentials: false

      - name: Checkout API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raouf-b-dev/ecommerce-store-api
          path: ecommerce-store-api
          persist-credentials: false

      - name: Materialize e2e credentials
        working-directory: ecommerce-admin-dashboard
        run: |
          cp .secrets.example .secrets
          echo "E2E credentials: .secrets.example defaults; non-empty GitHub secrets override."

      - name: Setup Node, pinned npm and dashboard dependencies
        uses: ./ecommerce-admin-dashboard/.github/actions/setup-node-ci
        with:
          working-directory: ecommerce-admin-dashboard
          cache-dependency-path: |
            ecommerce-admin-dashboard/package-lock.json
            ecommerce-store-api/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ecommerce-admin-dashboard/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: ecommerce-admin-dashboard
        run: npx playwright install --with-deps chromium

      - name: Install API dependencies
        working-directory: ecommerce-store-api
        run: npm ci

      - name: Generate API env and start Postgres/Redis
        working-directory: ecommerce-store-api
        run: |
          npm run env:init
          docker compose --env-file .env.development up -d --wait postgres redis

      - name: Migrate, boot, and seed API
        working-directory: ecommerce-store-api
        env:
          OTEL_TRACING_ENABLED: 'false'
        run: |
          npm run migration:run:dev
          npm run build
          npx cross-env NODE_ENV=development node --require ./dist/infrastructure/tracing/tracing.js dist/main.js &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/health/liveness >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/health/liveness
          npm run db:seed

      - name: Run Playwright
        working-directory: ecommerce-admin-dashboard
        run: npm run test:e2e

  ci:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, build, audit, e2e]
    if: always()
    steps:
      - name: Check all jobs status
        env:
          LINT_STATUS: ${{ needs.lint.result }}
          TYPECHECK_STATUS: ${{ needs.typecheck.result }}
          UNIT_STATUS: ${{ needs.unit-tests.result }}
          BUILD_STATUS: ${{ needs.build.result }}
          AUDIT_STATUS: ${{ needs.audit.result }}
          E2E_STATUS: ${{ needs.e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "lint: $LINT_STATUS"
          echo "typecheck: $TYPECHECK_STATUS"
          echo "unit-tests: $UNIT_STATUS"
          echo "build: $BUILD_STATUS"
          echo "audit: $AUDIT_STATUS"
          echo "e2e: $E2E_STATUS"

          for status in "$LINT_STATUS" "$TYPECHECK_STATUS" "$UNIT_STATUS" "$BUILD_STATUS" "$AUDIT_STATUS"; do
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "One of the required parallel jobs failed or was cancelled."
              exit 1
            fi
          done

          e2e_required=false
          if [ "$ACTOR" != "dependabot[bot]" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              e2e_required=true
            elif [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "master" ]; then
              e2e_required=true
            fi
          fi

          if [ "$e2e_required" = true ]; then
            if [ "$E2E_STATUS" != "success" ]; then
              echo "Playwright is required for this event and did not succeed ($E2E_STATUS)."
              exit 1
            fi
          elif [ "$E2E_STATUS" = "failure" ] || [ "$E2E_STATUS" = "cancelled" ]; then
            echo "Playwright failed or was cancelled."
            exit 1
          fi

          echo "All checks passed successfully!"

  # Docker jobs mirror ecommerce-store-api. The image has no API origin baked in:
  # the container renders /config.js from API_BASE_URL at start.
  docker-validate:
    name: Docker Validate
    runs-on: ubuntu-latest
    needs: [ci]
    # ci runs with always(), so the implicit success() check would skip this job;
    # gate on ci's result instead.
    if: ${{ !cancelled() && needs.ci.result == 'success' && github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The build stage runs on the runner's platform and the nginx stage has no
      # RUN step, so arm64 needs no emulation.
      - name: Build production image (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load amd64 image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ecommerce-admin-dashboard:ci-${{ github.sha }}
          cache-from: type=gha

      - name: Smoke test image
        env:
          IMAGE: ecommerce-admin-dashboard:ci-${{ github.sha }}
        run: |
          # Without API_BASE_URL the entrypoint must stop the container.
          docker run -d --name admin-noenv "$IMAGE"
          sleep 3
          if [ "$(docker inspect -f '{{.State.Running}}' admin-noenv)" = true ]; then
            echo "::error::the container started without API_BASE_URL"
            exit 1
          fi
          docker rm -f admin-noenv
          docker run -d --name admin -p 8080:8080 -e API_BASE_URL=https://api.example.test "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:8080/; then
              break
            fi
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:8080/orders
          curl -fsS http://localhost:8080/config.js | grep -F 'apiBaseUrl: "https://api.example.test"'
          docker rm -f admin

  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ !cancelled() && needs.ci.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/raouf-b-dev/ecommerce-admin-dashboard
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
