name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run unit tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run build
        run: npm run build

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Dependency audit (high/critical)
        run: npm audit --omit=dev --audit-level=high

  # Full-stack Playwright: seeded API + rate-limited login.
  # Release gate on PRs into master. Manual re-run via workflow_dispatch.
  # Skipped on push, on PRs into other branches, and for Dependabot PRs.
  # Demo seed passwords come from .secrets.example; optional GH secrets override.
  e2e:
    name: Playwright
    if: >
      github.actor != 'dependabot[bot]'
      && (
        github.event_name == 'workflow_dispatch'
        || (github.event_name == 'pull_request' && github.base_ref == 'master')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      VITE_API_BASE_URL: http://localhost:3000
      # Optional overrides. Empty (unset secret) is stripped in playwright.config.ts
      # so .secrets.example fills demo seed credentials.
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
      E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
      E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}

    steps:
      - name: Checkout dashboard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ecommerce-admin-dashboard
          persist-credentials: false

      - name: Checkout API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: raouf-b-dev/ecommerce-store-api
          path: ecommerce-store-api
          persist-credentials: false

      - name: Materialize e2e credentials
        working-directory: ecommerce-admin-dashboard
        run: |
          cp .secrets.example .secrets
          echo "E2E credentials: .secrets.example defaults; non-empty GitHub secrets override."

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ecommerce-admin-dashboard/.nvmrc
          cache: npm
          cache-dependency-path: |
            ecommerce-admin-dashboard/package-lock.json
            ecommerce-store-api/package-lock.json

      - name: Install dashboard dependencies
        working-directory: ecommerce-admin-dashboard
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ecommerce-admin-dashboard/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: ecommerce-admin-dashboard
        run: npx playwright install --with-deps chromium

      - name: Install API dependencies
        working-directory: ecommerce-store-api
        run: npm ci

      - name: Generate API env and start Postgres/Redis
        working-directory: ecommerce-store-api
        run: |
          npm run env:init
          docker compose --env-file .env.development up -d --wait postgres redis

      - name: Migrate, boot, and seed API
        working-directory: ecommerce-store-api
        env:
          OTEL_TRACING_ENABLED: 'false'
        run: |
          npm run migration:run:dev
          npm run build
          npx cross-env NODE_ENV=development node --require ./dist/infrastructure/tracing/tracing.js dist/main.js &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/health/liveness >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/health/liveness
          npm run db:seed

      - name: Run Playwright
        working-directory: ecommerce-admin-dashboard
        run: npm run test:e2e

  ci:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, build, audit, e2e]
    if: always()
    steps:
      - name: Check all jobs status
        env:
          LINT_STATUS: ${{ needs.lint.result }}
          TYPECHECK_STATUS: ${{ needs.typecheck.result }}
          UNIT_STATUS: ${{ needs.unit-tests.result }}
          BUILD_STATUS: ${{ needs.build.result }}
          AUDIT_STATUS: ${{ needs.audit.result }}
          E2E_STATUS: ${{ needs.e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "lint: $LINT_STATUS"
          echo "typecheck: $TYPECHECK_STATUS"
          echo "unit-tests: $UNIT_STATUS"
          echo "build: $BUILD_STATUS"
          echo "audit: $AUDIT_STATUS"
          echo "e2e: $E2E_STATUS"

          for status in "$LINT_STATUS" "$TYPECHECK_STATUS" "$UNIT_STATUS" "$BUILD_STATUS" "$AUDIT_STATUS"; do
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "One of the required parallel jobs failed or was cancelled."
              exit 1
            fi
          done

          e2e_required=false
          if [ "$ACTOR" != "dependabot[bot]" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              e2e_required=true
            elif [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "master" ]; then
              e2e_required=true
            fi
          fi

          if [ "$e2e_required" = true ]; then
            if [ "$E2E_STATUS" != "success" ]; then
              echo "Playwright is required for this event and did not succeed ($E2E_STATUS)."
              exit 1
            fi
          elif [ "$E2E_STATUS" = "failure" ] || [ "$E2E_STATUS" = "cancelled" ]; then
            echo "Playwright failed or was cancelled."
            exit 1
          fi

          echo "All checks passed successfully!"
