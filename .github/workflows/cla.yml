name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Same-repository signature commits need contents write. Pull request
# comments need pull-requests write. Re-running the failed check after a
# signature comment needs actions write. No other permissions are used.
permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/raouf-b-dev/ecommerce-admin-dashboard/blob/master/CLA.md
          # Not master: master rulesets require pull requests and signed commits.
          # The action creates this branch and the signature file. Do not commit
          # signatures/version1/cla.json on master.
          branch: cla-signatures
          allowlist: "raouf-b-dev,dependabot[bot],*[bot]"
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
