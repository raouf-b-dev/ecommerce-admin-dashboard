server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /mockServiceWorker.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
