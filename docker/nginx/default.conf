# Admin SPA on the unprivileged nginx image (port 8080, runs as uid 101).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Vite content-hashed bundles: cache for a year. A missing file is a 404,
    # not the SPA shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rendered at container start by /docker-entrypoint.d/40-render-config.sh.
    location = /config.js {
        root /tmp/admin-config;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
